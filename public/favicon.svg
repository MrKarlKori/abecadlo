<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Clean stone background without smudges -->
  <rect width="120" height="120" rx="15" fill="#ece8df" />
  <rect x="8" y="8" width="104" height="104" rx="8" fill="none" stroke="#332f2a" stroke-width="2" />

  <!-- Clean, recognizable Bull Head (Proto-Sinaitic Aleph styling) -->
  
  <!-- Face/Snout shape -->
  <path d="M 40 50 Q 60 45 80 50 L 60 95 Z" fill="none" stroke="#1a1814" stroke-width="6" stroke-linejoin="round"/>
  
  <!-- Horns curving outwards and up -->
  <path d="M 40 50 C 20 40 15 25 25 20" fill="none" stroke="#1a1814" stroke-width="6" stroke-linecap="round"/>
  <path d="M 80 50 C 100 40 105 25 95 20" fill="none" stroke="#1a1814" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Small stylized ears below the horns -->
  <path d="M 40 50 C 28 52 24 58 35 62" fill="none" stroke="#1a1814" stroke-width="4" stroke-linecap="round"/>
  <path d="M 80 50 C 92 52 96 58 85 62" fill="none" stroke="#1a1814" stroke-width="4" stroke-linecap="round"/>

  <!-- Minimal archaic eyes -->
  <circle cx="52" cy="65" r="3.5" fill="#1a1814" />
  <circle cx="68" cy="65" r="3.5" fill="#1a1814" />
  
  <!-- Nostrils / Snout definition -->
  <path d="M 55 85 Q 60 82 65 85" fill="none" stroke="#1a1814" stroke-width="3" stroke-linecap="round" />
</svg>